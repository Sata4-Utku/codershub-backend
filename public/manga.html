<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga Katalogu — Kuroverse</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <div id="kv-navbar"></div>

  <main class="kv-page-enter">
    <section class="kv-section" style="padding-top:40px;">
      <div class="kv-container">
        <div class="kv-section-head">
          <div>
            <span class="kv-tag">Kutuphane</span>
            <h2>Manga Katalogu</h2>
            <p id="kv-catalog-count">Yukleniyor...</p>
          </div>
        </div>

        <div class="kv-filterbar">
          <div class="kv-search-wrap">
            <svg class="kv-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
            <input type="text" class="kv-input" id="kv-catalog-search" placeholder="Manga ara..." />
          </div>
        </div>
        <div class="kv-filterbar" id="kv-genre-chips" style="margin-bottom:30px;"></div>

        <div class="kv-grid" id="kv-catalog-grid"></div>
        <div class="kv-empty kv-hidden" id="kv-catalog-empty">
          <p>Aramana uygun manga bulunamadi.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="kv-footer"></div>

  <script>window.KV_CATALOG_TYPE = 'manga';</script>
  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/effects.js"></script>
  <script src="/assets/js/cards.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/catalog.js"></script>
</body>
</html>
