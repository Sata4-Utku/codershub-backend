<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izle — Anidox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%237a0c14%22/><path d=%22M5 19L19 5%22 stroke=%22%23ff5555%22 stroke-width=%223%22 stroke-linecap=%22round%22/></svg>" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <div id="kv-navbar"></div>

  <main class="kv-page-enter">
    <section class="kv-detail-hero">
      <div class="kv-detail-banner" id="kv-detail-banner" style="background: linear-gradient(120deg, #e81c33, #170a0a);"></div>
      <div class="kv-container">
        <div class="kv-detail-grid">
          <div class="kv-detail-cover" id="kv-detail-cover" style="background: linear-gradient(150deg, #e81c33, #170a0a);">
            <canvas id="kv-detail-cover-canvas"></canvas>
          </div>
          <div class="kv-detail-info" id="kv-detail-info">
            <div class="kv-skel" style="height:32px;width:60%;border-radius:8px;margin-bottom:14px;"></div>
            <div class="kv-skel" style="height:14px;width:40%;border-radius:8px;"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="kv-section" style="padding-top:10px;">
      <div class="kv-container">
        <div class="kv-player" id="kv-player">
          <div class="kv-player-badge" id="kv-player-ep-label">Bolum 1</div>
          <div class="kv-player-screen">
            <canvas id="kv-player-canvas"></canvas>
            <button class="kv-player-center-play" id="kv-player-toggle">
              <svg class="kv-icon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
            </button>
          </div>
          <div class="kv-player-controls">
            <div class="kv-progress-track" id="kv-progress-track">
              <div class="kv-progress-fill" id="kv-progress-fill"></div>
            </div>
            <div class="kv-player-row">
              <button class="kv-icon-btn" id="kv-player-toggle-2" title="Oynat/Duraklat">
                <svg class="kv-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
              </button>
              <span style="font-size:0.85rem;">Anidox Player</span>
              <span class="kv-player-time" id="kv-player-time">00:00 / 00:00</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="kv-section" style="padding-top:0;">
      <div class="kv-container">
        <div class="kv-section-head">
          <div>
            <span class="kv-tag">Bolumler</span>
            <h2 id="kv-ep-count-title">Bolumler</h2>
          </div>
        </div>
        <div class="kv-ep-list" id="kv-ep-list"></div>
      </div>
    </section>
  </main>

  <div id="kv-footer"></div>

  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/effects.js"></script>
  <script src="/assets/js/cards.js"></script>
  <script src="/assets/js/poster.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/watch.js"></script>
</body>
</html>
